version: 2

project_name: cm

dist: dist

before:
  hooks:
    - go mod tidy -diff
    - go test ./...

builds:
  - id: cm
    main: ./cmd/cm
    binary: cm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/zhongyangchuwu/cm/internal/build.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: cm
    ids:
      - cm
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: zhongyangchuwu
    name: chezmoi-kit
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## cm {{ .Tag }}

    See `CHANGELOG.md` for the curated release notes.
