name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install chezmoi integration dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.72.1 --repo twpayne/chezmoi --pattern chezmoi-linux-amd64 --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/chezmoi-linux-amd64"
          mv "$RUNNER_TEMP/chezmoi-linux-amd64" "$RUNNER_TEMP/chezmoi"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check module tidy state
        run: go mod tidy -diff

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Snapshot release build
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
